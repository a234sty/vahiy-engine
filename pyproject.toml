[project]
name = "vahiy-engine"
version = "1.0.0"
description = "Backend and AI engine powering Vahiy AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = [
    "openai>=1.50",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vahiy_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() default-argument pattern is idiomatic, not a real mutable-default bug.
"src/vahiy_engine/api/routes/*.py" = ["B008"]
# These are data files of natural-language question strings, not logic --
# mechanically line-wrapping a question sentence hurts readability rather
# than helping it.
"tests/benchmark/question_bank/theological.py" = ["E501"]
"tests/benchmark/question_bank/historical.py" = ["E501"]
"tests/benchmark/question_bank/linguistic.py" = ["E501"]
"tests/benchmark/question_bank/cross_scripture.py" = ["E501"]
"tests/benchmark/question_bank/adversarial.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
